<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>触屏模拟器终极侦测</title>
    <style>
        body { 
            font-family: sans-serif; 
            background: #1e1e1e; 
            color: #fff; 
            text-align: center; 
            padding-top: 10vh; 
            margin: 0;
            height: 100vh;
            /* 极其关键：彻底禁用浏览器默认的触控行为（包括左右滑动返回、上下滑动滚动） */
            touch-action: none; 
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .action { font-size: 60px; color: #00ff88; font-weight: bold; margin: 20px; text-align: center; }
        .log { color: #888; font-family: monospace; font-size: 16px; margin-top: 20px; text-align: center; }
        .history { 
            margin-top: 30px; 
            width: 90%; 
            max-width: 600px; 
            height: 300px; 
            background: #000; 
            color: #0f0; 
            overflow-y: auto; 
            padding: 10px; 
            border-radius: 8px;
            font-family: monospace;
            text-align: left;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <h2 style="text-align:center;">👆 触屏模拟侦测 (已拦截一切滑动跳转)</h2>
    <div class="action" id="action">请按遥控器...</div>
    <div class="log" id="log">-</div>
    <div class="history" id="history">===== 操作历史记录 =====<br></div>

    <script>
        const actionEl = document.getElementById('action');
        const logEl = document.getElementById('log');
        const historyEl = document.getElementById('history');
        
        function appendHistory(text) {
            const time = new Date().toLocaleTimeString();
            historyEl.innerHTML = `[${time}] ${text}<br>` + historyEl.innerHTML;
        }

        let startX = 0, startY = 0;

        // 监听触控开始
        window.addEventListener('touchstart', (e) => {
            // e.preventDefault();
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
            logEl.textContent = `[触控按下] X: ${Math.round(startX)}, Y: ${Math.round(startY)}`;
        }, { passive: false });

        // 监听触控结束
        window.addEventListener('touchend', (e) => {
            const endX = e.changedTouches[0].clientX;
            const endY = e.changedTouches[0].clientY;
            const dx = endX - startX;
            const dy = endY - startY;

            let actionText = "";
            if (Math.abs(dx) < 10 && Math.abs(dy) < 10) {
                actionText = "👆 屏幕点击 (OK键)";
            } else if (Math.abs(dx) > Math.abs(dy)) {
                actionText = dx > 0 ? "➡️ 向右滑动" : "⬅️ 向左滑动";
            } else {
                actionText = dy > 0 ? "⬇️ 向下滑动" : "⬆️ 向上滑动";
            }
            actionEl.textContent = actionText;
            const logText = `[触控释放] dx: ${Math.round(dx)}, dy: ${Math.round(dy)}`;
            logEl.textContent = logText;
            appendHistory(`${actionText}  ${logText}`);
        }, { passive: false });

        // 依然保留多媒体键的监听
        window.addEventListener('keydown', (e) => {
            let actionText = "";
            if (e.key === 'MediaPlayPause') actionText = "⏯️ 播放/暂停";
            if (e.key === 'MediaVolumeUp' || e.key === 'AudioVolumeUp') actionText = "🔊 音量加";
            if (e.key === 'MediaVolumeDown' || e.key === 'AudioVolumeDown') actionText = "🔉 音量减";
            
            if (actionText) {
                actionEl.textContent = actionText;
                appendHistory(`${actionText}  (Key: ${e.key})`);
            }
        });
    </script>
</body>
</html>
